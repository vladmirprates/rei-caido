<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rei Caído</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&family=Noto+Sans+Symbols+2&display=swap">
<style>
/* Layout: board is the altar, skill hotbar under it like an ARPG; hero ledger on the right. Single dark look by choice. */
:root{
  --void:#0f0c0b; --stone:#1b1714; --stone-2:#241e19; --line:#3a3128;
  --bone:#e7dcc6; --ash:#a89b87; --ember:#e07a32; --blood:#b8332b; --gold:#e3b456; --frost:#a9bfd6;
  --r-common:#cfc6b6; --r-magic:#8aa4ff; --r-rare:#ecd36a; --r-legend:#f08a3c;
  --f-display:"IM Fell English SC", Georgia, "Times New Roman", serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-glyph:"Noto Sans Symbols 2", "Segoe UI Symbol", "DejaVu Sans", serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--void);color:var(--bone)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 36px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
h1{font-family:var(--f-display);font-weight:400;font-size:2.2rem;margin:0;letter-spacing:.02em;line-height:1}
.floor{font-family:var(--f-display);color:var(--ember);font-size:1.15rem}
.turn{color:var(--ash);font-size:.78rem;text-transform:uppercase;letter-spacing:.14em}
.herochip{margin-left:auto;color:var(--ash);font-size:.85rem}
.muted{color:var(--ash)}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.rc-common{color:var(--r-common)} .rc-magic{color:var(--r-magic)} .rc-rare{color:var(--r-rare)} .rc-legend{color:var(--r-legend)}
.rule{color:var(--ember)}
.g{font-family:var(--f-glyph);line-height:1}
.g.w{color:#f1e7d3;-webkit-text-stroke:1px #2a1f18}
.g.b{color:#1b1411;-webkit-text-stroke:1px #cdbb9c}
.primary{background:var(--ember);color:#1a0f08;border:0;padding:10px 22px;font-family:var(--f-display);font-size:1.1rem;cursor:pointer}
.primary:hover:not(:disabled){background:#ec8a44}
.ghost{background:transparent;color:var(--bone);border:1px solid var(--line);padding:8px 16px;font:inherit;cursor:pointer}
.ghost:hover:not(:disabled){border-color:var(--ember)}
.primary:disabled,.ghost:disabled{opacity:.4;cursor:not-allowed}
.sm{padding:5px 10px;font-size:.85rem}
.primary.sm{font-size:.95rem}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* ----- hero select & camp ----- */
.screen{display:grid;gap:28px}
#scrHeroes{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
@media (max-width:820px){#scrHeroes{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.sh{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:0}
.sub{font-family:var(--f-display);font-weight:400;font-size:1.15rem;margin:14px 0 4px;display:flex;gap:8px;align-items:baseline}
.sub .muted{font-family:var(--f-body);font-size:.8rem}
.lbl{margin:6px 0 0;font-size:.7rem;text-transform:uppercase;letter-spacing:.16em;color:var(--ash)}
.txt{background:var(--stone-2);border:1px solid var(--line);color:var(--bone);font:inherit;padding:8px 10px;width:100%}
.hcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--stone);border:1px solid var(--line);padding:10px 12px}
.hcard .g{font-size:2rem}
.hinfo{display:flex;flex-direction:column;min-width:0}
.hinfo span{color:var(--ash);font-size:.85rem}
.hbtns{display:flex;flex-direction:column;gap:6px}
.classes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cls{background:var(--stone-2);border:1px solid var(--line);color:var(--bone);padding:8px 2px 6px;font:inherit;font-size:.78rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cls .g{font-size:1.7rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{background:var(--stone-2);border:1px solid var(--line);color:var(--bone);padding:10px 12px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.choice strong{font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.choice .d{font-size:.8rem;color:var(--ash)}
.choice[aria-pressed="true"],.cls[aria-pressed="true"]{border-color:var(--ember);box-shadow:inset 0 0 0 1px var(--ember)}
.cls-desc{margin:0;font-size:.88rem;color:var(--ash)}
.cls-desc b{color:var(--bone);font-weight:500}
.notice{margin:0;padding:10px 14px;border:1px solid #6b4a2a;background:var(--stone);color:var(--bone)}
.campgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}
@media (max-width:980px){.campgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:640px){.campgrid{grid-template-columns:minmax(0,1fr)}}
.ccol{display:flex;flex-direction:column;gap:6px;min-width:0}
.herohead{display:flex;gap:12px;align-items:center}
.g.big{font-size:3rem}
.trow,.erow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:7px 0}
.trow b,.erow b{font-weight:500}
.trow small,.erow small{display:block;color:var(--ash);font-size:.8rem}
.trow.locked{opacity:.55}
.rank{color:var(--ember);font-size:.8rem;font-variant-numeric:tabular-nums}
.vbtns{display:flex;flex-direction:column;gap:4px}
.hint.tut{color:var(--bone);background:linear-gradient(90deg,rgba(227,180,86,.12),transparent);border-left:3px solid var(--gold);padding:8px 12px}
.hint.tut b{color:var(--gold)}
.tutbar{width:100%;max-width:640px;margin:0 auto 8px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--gold);border-radius:6px;background:linear-gradient(90deg,rgba(227,180,86,.16),rgba(227,180,86,.04));box-shadow:0 0 18px rgba(227,180,86,.12)}
.tutbar .tt-step{font-family:var(--f-display);color:var(--gold);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.tutbar b{color:var(--bone);font-size:1.05rem;font-weight:600}
.tutbar .tt-dots{display:flex;gap:5px}
.tutbar .tt-dots i{width:8px;height:8px;border-radius:50%;background:rgba(227,180,86,.25)}
.tutbar .tt-dots i.on{background:var(--gold)}
.tutbar.flash{animation:tutFlash .6s ease-out}
@keyframes tutFlash{from{background:rgba(143,209,138,.35)}}
.hk.tutpulse{outline:2px solid var(--gold);animation:tutPulse 1s ease-in-out infinite alternate}
@keyframes tutPulse{from{box-shadow:0 0 0 rgba(227,180,86,0)}to{box-shadow:0 0 16px rgba(227,180,86,.7)}}
@media (max-width:560px){.tutbar{grid-template-columns:minmax(0,1fr) auto}.tutbar b{grid-column:1/-1;grid-row:2}}
.tidebar{width:100%;max-width:640px;margin:0 auto 6px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;color:#ff8a7a;font-family:var(--f-display);font-size:1rem}
.tb-bar{height:10px;background:#1a0b09;border:1px solid #6b1a12;position:relative}
.tb-bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#6e1612,#e0402f);transition:width .3s}
.hordebar{color:#ffb26a}.hordebar .tb-bar{border-color:#7a3a12;background:#1d0f07}.hordebar .tb-bar i{background:linear-gradient(90deg,#8a3a10,#ffa040)}
.tidebar small{font-family:var(--f-body);color:var(--ash);font-size:.78rem;font-variant-numeric:tabular-nums}
.aprog{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:6px;align-items:center;font-size:.8rem;color:var(--ash)}
.adots{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.adots i{display:block;aspect-ratio:1;border:1px solid var(--line);background:var(--stone-2)}
.adots i.done{background:var(--bc);border-color:transparent;box-shadow:0 0 6px var(--bc)}
.atlasgrid{display:grid;grid-template-columns:110px repeat(10,minmax(0,1fr));gap:4px;align-items:center;max-width:760px}
.atlasgrid .ah{font-size:.72rem;color:var(--ash);text-align:center}
.atlasgrid .ab{font-size:.85rem}
.atlasgrid i{display:block;aspect-ratio:1;border:1px solid var(--line);background:var(--stone-2)}
.atlasgrid i.done{background:var(--bc,#e07a32);border-color:transparent;box-shadow:0 0 8px var(--bc,#e07a32)}
.curbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.curbar button{font-size:.75rem;padding:3px 8px}
.treewrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
@media (max-width:900px){.treewrap{grid-template-columns:minmax(0,1fr)}}
.treesvg{width:100%;max-width:min(900px,calc(100vh - 230px));min-width:320px;justify-self:center;aspect-ratio:1;background:radial-gradient(circle,#211a15,#120e0c 70%);border:1px solid var(--line)}
.treesvg line{stroke:#3a3128;stroke-width:.08}
.treesvg line.on{stroke:var(--ember);stroke-width:.12}
.treesvg .nd{cursor:pointer}
.treesvg .nd circle{fill:#1b1714;stroke:#5d5248;stroke-width:.08}
.treesvg .nd.avail circle{stroke:#e7dcc6;stroke-width:.12}
.treesvg .nd.on circle{fill:var(--ember);stroke:#ffd9a8}
.treesvg .nd.key circle{stroke-width:.16}
.treesvg .nd.sel circle{stroke:#8fd18a;stroke-width:.18}
.treesvg .nd.start circle{fill:#e3b456}
.treesvg .nd:hover circle{stroke:#ffd9a8;stroke-width:.16}
.treesvg text{fill:#a89b87;font-size:.4px;text-anchor:middle;pointer-events:none;font-family:var(--f-body)}
.treesvg text.on{fill:#e7dcc6}
.ttip{position:fixed;z-index:30;pointer-events:none;max-width:280px;background:rgba(18,14,12,.97);border:1px solid #6b4a2a;box-shadow:0 10px 30px rgba(0,0,0,.6);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.ttip .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ash)}
.ttip b{font-family:var(--f-display);font-weight:400;font-size:1.1rem;color:var(--bone)}
.ttip b.notable{color:var(--r-rare)} .ttip b.key{color:var(--r-legend)}
.ttip p{margin:0;font-size:.85rem;color:var(--bone)}
.ttip .st{font-size:.78rem}
.ttip .st.on{color:#8fd18a} .ttip .st.av{color:#ffd9a8} .ttip .st.no{color:var(--ash)}
.tdet{background:var(--stone);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.tdet b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.tdet p{margin:0;font-size:.85rem;color:var(--ash)}
.resline{margin:6px 0 0;font-size:.82rem;color:var(--ash)}
.resline b{font-weight:500}
.chessbar{width:100%;max-width:640px;margin:4px auto 0;display:flex;gap:10px;align-items:center;background:linear-gradient(#1d2630,#151b22);border:1px solid #5a6a7e;padding:10px 12px}
.cbtxt{flex:1;display:flex;flex-direction:column;min-width:0}
.cbtxt b{font-family:var(--f-display);font-weight:400;font-size:1.15rem;color:#dfeaf5}
.cbtxt small{color:#a9bfd6;font-size:.8rem}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gcard{background:var(--stone);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.gcard.known{border-color:#5a6a7e}
.gcard b{font-family:var(--f-display);font-weight:400;font-size:1.1rem}
.gcard p{margin:0;font-size:.84rem;color:var(--ash)}
.gcard .pw{color:#c9a0ff}
.mini{display:grid;grid-template-columns:repeat(8,22px);grid-template-rows:repeat(8,22px);width:max-content;border:1px solid #5a6a7e}
.mini i{display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--f-glyph);font-size:16px;line-height:1;overflow:hidden}
.mini i.l{background:#c7d3df}.mini i.d{background:#6c7f93}
.mini i.w{color:#f6f1e6;text-shadow:0 0 1px #000,0 0 2px #000}.mini i.b{color:#15100d}
.runebag{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rchip{border:1px solid #6a4f94;color:#d9c6ff;background:#221a30;font-size:.8rem;padding:3px 9px}
.rchip b{font-weight:600;margin-left:3px}
.scard{background:var(--stone);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.scard.onbar{border-color:var(--ember);box-shadow:inset 0 0 0 1px rgba(224,122,50,.35)}
.scard.locked{opacity:.5}
.scard p{margin:0;font-size:.85rem;color:var(--ash)}
.scard .tt b{font-family:var(--f-display);font-weight:400;font-size:1.1rem}
.rslot{border:1px dashed #6a4f94;padding:7px 9px;font-size:.8rem;color:var(--ash);display:flex;flex-direction:column;gap:6px}
.rslot b{color:#d9c6ff;font-weight:500}
.rpick{display:flex;flex-wrap:wrap;gap:4px}
.rpick button{font-size:.75rem;padding:3px 7px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tier{font-size:.66rem;padding:0 4px;border:1px solid currentColor;opacity:.75;margin-left:2px;letter-spacing:.04em;vertical-align:1px}
.tier.t1,.tier.t2{color:#8f8576}.tier.t3{color:#cfc6b6}.tier.t4{color:var(--r-rare)}.tier.t5{color:var(--r-legend)}
.heir{font-size:.66rem;color:#c9a0ff;text-transform:uppercase;letter-spacing:.1em}
.tafx{margin:2px 0 4px;padding:0;list-style:none;font-size:.8rem;color:var(--ash)}
.tip .diff{font-size:.78rem;border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
/* ----- camp (tabs) ----- */
#scrCamp{gap:16px;grid-template-columns:minmax(0,1fr)}
.camphead{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(160px,240px) auto auto;gap:14px 22px;align-items:center;background:var(--stone);border:1px solid var(--line);padding:14px 16px}
.camphead .stats{margin:0;min-width:200px}
.chname{display:flex;flex-direction:column;min-width:0}
.chlvl .vl{display:flex;justify-content:space-between;font-size:.75rem;color:var(--ash);margin-bottom:4px}
@media (max-width:900px){.camphead{grid-template-columns:auto minmax(0,1fr)}.camphead>.chlvl,.camphead>.stats,.camphead>button{grid-column:1/-1}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs .tab{flex:none}
.tab{background:transparent;border:1px solid transparent;border-bottom:0;color:var(--ash);font-family:var(--f-display);font-size:1.1rem;padding:9px 18px 8px;cursor:pointer;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--bone)}
.tab.on{color:var(--bone);background:var(--stone);border-color:var(--line);border-bottom:1px solid var(--stone)}
.badge{background:var(--ember);color:#1a0f08;font-family:var(--f-body);font-weight:700;font-size:.72rem;border-radius:9px;padding:1px 7px}
.tabbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.small{font-size:.8rem}
/* equipment tab */
.gearlayout{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) minmax(0,300px);gap:18px;align-items:start}
@media (max-width:1000px){.gearlayout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.gearlayout .detail{grid-column:1/-1}}
@media (max-width:640px){.gearlayout{grid-template-columns:minmax(0,1fr)}}
.gpanel{background:var(--stone);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.gpanel .sub{margin:0}
.eslots{display:flex;flex-direction:column;gap:6px}
.eslot{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;gap:8px}
.eslot .itile{flex-direction:row;justify-content:flex-start;min-height:46px;padding:6px 8px;text-align:left}
.eslot .itile .sicon{width:26px;height:26px;flex:none}
.st4{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--stone-2);border:1px solid var(--line);color:var(--ash);font:inherit;font-size:.8rem;padding:4px 10px;cursor:pointer}
.chip span{color:var(--bone);opacity:.7;margin-left:3px;font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--ember);color:var(--bone)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.itile{--rc:var(--r-common);position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;background:linear-gradient(var(--stone-2),#16120f);border:1px solid color-mix(in srgb,var(--rc) 45%,var(--line));color:var(--rc);padding:10px 6px 8px;font:inherit;cursor:pointer;min-width:0;min-height:96px}
.itile:hover{border-color:var(--rc)}
.itile.sel{border-color:var(--rc);box-shadow:inset 0 0 0 1px var(--rc),0 0 14px color-mix(in srgb,var(--rc) 35%,transparent)}
.itile.r-magic{--rc:var(--r-magic)} .itile.r-rare{--rc:var(--r-rare)} .itile.r-legend{--rc:var(--r-legend);background:radial-gradient(circle at 50% 30%,rgba(240,138,60,.16),transparent 70%),linear-gradient(var(--stone-2),#16120f)}
.itile.empty{cursor:default;color:#5d5248;border-style:dashed;border-color:var(--line)}
.sicon{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.iname{font-size:.74rem;line-height:1.2;color:var(--bone);text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.eslot .iname{text-align:left;font-size:.82rem}
.itile.empty .iname{color:#5d5248}
.dh{font-family:var(--f-body);font-weight:500;font-size:.85rem;margin:4px 0 0;color:var(--ash)}
.diff{margin:0;padding:0;list-style:none;font-size:.85rem;display:flex;flex-direction:column;gap:2px}
.diff .up{color:#8fd18a} .diff .down{color:#ff8a7a}
.diff .up::before{content:"▲ ";font-size:.7em} .diff .down::before{content:"▼ ";font-size:.7em}
.curd summary{cursor:pointer;color:var(--ash);font-size:.82rem;margin-bottom:6px}
/* talents tab */
.thead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.thead p{margin:0}
.pts{color:var(--ember);font-size:1.1rem}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tcard{background:var(--stone);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tcard.has{border-color:#6b4a2a}
.tcard.locked{opacity:.55}
.tcard p{margin:0;font-size:.85rem;color:var(--ash);flex:1}
.tt{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px}
.tt b{font-weight:500}
.pips{display:flex;gap:4px}
.pips i{width:9px;height:9px;border:1px solid var(--ember);transform:rotate(45deg)}
.pips i.on{background:var(--ember)}
/* expeditions tab */
.tormbar{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--stone);border:1px solid #6b4a2a;padding:12px 14px}
.tormbar p{margin:2px 0 0;max-width:80ch}
.tormbar{padding:10px 14px}
@media (max-width:640px){.tormbar{flex-direction:column;align-items:stretch}}
.tstep{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;color:var(--ash)}
.xk{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ash)}
.tormbar b,.xcard b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.xcard{--bc:var(--line);background:var(--stone);border:1px solid var(--line);border-top:3px solid var(--bc);padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.xcard p{margin:0;font-size:.84rem;color:var(--ash)}
.xcard button{margin-top:auto}
.uown{list-style:none;margin:0;padding:0;font-size:.82rem;display:grid;gap:2px}

.actnode.bio-crypt,.actdetail.bio-crypt{--bc:#8a6a48} .actnode.bio-swamp,.actdetail.bio-swamp{--bc:#5f8a55} .actnode.bio-forge,.actdetail.bio-forge{--bc:#d0602a} .actnode.bio-cathedral,.actdetail.bio-cathedral{--bc:#8fb0d8}
.actdetail{--bc:var(--line);display:flex;justify-content:space-between;align-items:flex-end;gap:18px;background:linear-gradient(120deg,color-mix(in srgb,var(--bc) 14%,var(--stone)),var(--stone));border:1px solid var(--line);border-left:4px solid var(--bc);padding:16px 18px}

.mtile.bio-crypt,.dev-core.bio-crypt{--bc:#8a6a48} .mtile.bio-swamp,.dev-core.bio-swamp{--bc:#5f8a55} .mtile.bio-forge,.dev-core.bio-forge{--bc:#d0602a} .mtile.bio-cathedral,.dev-core.bio-cathedral{--bc:#8fb0d8} .mtile.bio-storm,.dev-core.bio-storm{--bc:#5b8fd8} .mtile.bio-tar,.dev-core.bio-tar{--bc:#c9a24a} .mtile.bio-fungal,.dev-core.bio-fungal{--bc:#8a5fc0} .mtile.bio-ash,.dev-core.bio-ash{--bc:#c9a05a} .mtile.bio-sea,.dev-core.bio-sea{--bc:#4a9ab8}

}
.gearicons{display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:840px){.game{grid-template-columns:minmax(0,1fr)}}

/* ===== interface polish: buttons, panels, skill cards, bars, dialogs (this block overrides the plainer rules above) ===== */
:root{--ember-hi:#f09a52;--ember-lo:#a84d16;--gold-hi:#f0cf85;--edge-hi:rgba(255,236,206,.10);--edge-lo:rgba(0,0,0,.5)}
/* buttons */
.primary{position:relative;background:linear-gradient(#f2994f 0%,#e07a32 46%,#b95c20 100%);color:#1c0f07;border:1px solid #7a3a10;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,232,200,.55),inset 0 -2px 0 rgba(90,40,10,.45),0 2px 0 #3a1a08,0 6px 14px rgba(0,0,0,.45);text-shadow:0 1px 0 rgba(255,220,180,.35);transition:transform .12s,box-shadow .18s,filter .18s}
.primary:hover:not(:disabled){background:linear-gradient(#f9ad6a,#ec8a44 46%,#c8672a);box-shadow:inset 0 1px 0 rgba(255,238,210,.6),inset 0 -2px 0 rgba(90,40,10,.45),0 2px 0 #3a1a08,0 8px 20px rgba(224,122,50,.35);transform:translateY(-1px)}
.primary:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(60,24,6,.6),0 1px 0 #3a1a08}
.ghost{position:relative;background:linear-gradient(rgba(255,255,255,.035),rgba(0,0,0,.18));border:1px solid #3d332a;border-radius:2px;box-shadow:inset 0 1px 0 var(--edge-hi),0 2px 6px rgba(0,0,0,.35);transition:border-color .18s,box-shadow .18s,transform .12s,background .18s}
.ghost:hover:not(:disabled){border-color:var(--ember);background:linear-gradient(rgba(224,122,50,.12),rgba(0,0,0,.18));box-shadow:inset 0 1px 0 rgba(255,220,180,.18),0 0 0 1px rgba(224,122,50,.25),0 4px 14px rgba(224,122,50,.18);transform:translateY(-1px)}
.ghost:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
/* skill cards */
.hotbar{gap:10px}
.hk{border:1px solid #43372c;border-left:3px solid var(--ember);border-radius:2px;padding:10px 11px 9px;background:linear-gradient(180deg,rgba(255,236,206,.06) 0%,rgba(255,236,206,0) 38%),linear-gradient(#2a221c,#17120f);box-shadow:inset 0 1px 0 var(--edge-hi),inset 0 -12px 18px rgba(0,0,0,.28),0 3px 10px rgba(0,0,0,.4);overflow:hidden;transition:transform .14s,border-color .18s,box-shadow .2s}
.hk::before{content:"";position:absolute;right:-26px;top:-26px;width:70px;height:70px;background:radial-gradient(circle,rgba(224,122,50,.22),rgba(224,122,50,0) 70%);pointer-events:none;transition:opacity .2s;opacity:.55}
.hk:hover:not(:disabled){transform:translateY(-2px);border-color:#c06a2c;border-left-color:var(--gold);box-shadow:inset 0 1px 0 rgba(255,236,206,.14),0 8px 20px rgba(0,0,0,.5),0 0 0 1px rgba(224,122,50,.3),0 0 18px rgba(224,122,50,.22)}
.hk:hover:not(:disabled)::before{opacity:1}
.hk:active:not(:disabled){transform:translateY(0)}
.hk.active{border-color:var(--gold);border-left-color:var(--gold);background:linear-gradient(180deg,rgba(255,214,150,.16) 0%,rgba(255,214,150,0) 45%),linear-gradient(#34281d,#1c1510);box-shadow:inset 0 0 0 1px rgba(227,180,86,.55),0 0 22px rgba(227,180,86,.3);animation:hkGlow 1.6s ease-in-out infinite alternate}
@keyframes hkGlow{from{box-shadow:inset 0 0 0 1px rgba(227,180,86,.45),0 0 14px rgba(227,180,86,.2)}to{box-shadow:inset 0 0 0 1px rgba(227,180,86,.75),0 0 26px rgba(227,180,86,.42)}}
.hk .key{top:7px;right:7px;min-width:20px;height:20px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #6b4a2a;border-radius:3px;background:linear-gradient(#3a2c20,#1f1712);color:var(--gold-hi);font-size:.82rem;box-shadow:inset 0 1px 0 rgba(255,236,206,.15),0 1px 2px rgba(0,0,0,.5)}
.hk b{font-family:var(--f-display);font-weight:400;font-size:1rem;letter-spacing:.01em;color:#f1e6d0;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.hk small{color:#b3a690}
.hk .cd{background:repeating-linear-gradient(135deg,rgba(10,7,5,.72) 0 6px,rgba(22,16,12,.72) 6px 12px);color:var(--gold-hi);text-shadow:0 0 12px rgba(227,180,86,.6),0 2px 0 #000;font-size:2.1rem;backdrop-filter:grayscale(.6)}
.hk:disabled{opacity:.55;border-left-color:#5a4a3a}
.hk:disabled::before{opacity:0}
/* panels and cards: a lit top edge, a darker body and small corner marks */
.panel>section,.panel>div:not(.hotbar){position:relative}
.hcard,.card,.xcard,.modal-box,.gpanel{background:linear-gradient(180deg,rgba(255,236,206,.045),rgba(255,236,206,0) 30%),var(--stone);border-color:#3d332a;border-radius:2px;box-shadow:inset 0 1px 0 var(--edge-hi),0 6px 18px rgba(0,0,0,.38)}
.card{background:linear-gradient(180deg,rgba(255,236,206,.05),rgba(255,236,206,0) 36%),var(--stone-2)}
.modal{background:radial-gradient(ellipse at center,rgba(20,14,10,.78),rgba(6,4,3,.92));backdrop-filter:blur(3px)}
.modal-box{border:1px solid #5a4430;box-shadow:inset 0 1px 0 rgba(255,236,206,.12),0 0 0 1px rgba(0,0,0,.6),0 24px 60px rgba(0,0,0,.65);position:relative}
.modal-box::before,.modal-box::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--gold);opacity:.7;pointer-events:none}
.modal-box::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.modal-box::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.modal-box h3{text-shadow:0 2px 8px rgba(0,0,0,.6);background:linear-gradient(90deg,var(--gold-hi),#e7dcc6);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel h2{padding-bottom:6px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,#6b4a2a,rgba(107,74,42,0)) 1;letter-spacing:.03em}
.sub{position:relative}
/* bars: a bevel, a bright top edge and a soft sheen */
.bar{border:1px solid #4a3b2e;border-radius:1px;background:linear-gradient(#0c0907,#17110e);box-shadow:inset 0 2px 4px rgba(0,0,0,.7),0 1px 0 rgba(255,236,206,.06)}
.bar>i{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 3px rgba(0,0,0,.3);background:linear-gradient(#e0584a 0%,#b8332b 45%,#7b1d17 100%)}
.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.22) 50%,rgba(255,255,255,0) 100%);transform:translateX(-100%);animation:barSheen 3.8s ease-in-out infinite}
@keyframes barSheen{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.bar.shield>i{background:linear-gradient(#d4e2f0,#8aa2bb 45%,#5a6c80)}
.bar.xp>i{background:linear-gradient(#f5e08a,#d2a640 45%,#9a7a2a)}
.vl{letter-spacing:.12em}
.stats div{border-top:1px solid #4a3b2e;background:linear-gradient(rgba(255,236,206,.04),rgba(255,236,206,0));padding:6px 4px 3px}
.stats dd{text-shadow:0 1px 3px rgba(0,0,0,.6)}
/* tooltips */
.ttip{border-color:#8a5a2c;background:linear-gradient(rgba(255,236,206,.05),rgba(255,236,206,0) 30%),rgba(18,14,12,.98);box-shadow:inset 0 1px 0 rgba(255,236,206,.1),0 12px 34px rgba(0,0,0,.7)}
@media (prefers-reduced-motion:reduce){.bar>i::after,.hk.active{animation:none}.hk,.primary,.ghost{transition:none}}
/* ===== camp polish: header, tabs, gear, forge, skills, atlas, expeditions ===== */
#scrCamp{gap:18px}
/* hero banner: a lit medallion, a gold rule and an ember glow in the corner */
.camphead{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 0% 0%,rgba(224,122,50,.16),rgba(224,122,50,0) 46%),linear-gradient(180deg,rgba(255,236,206,.05),rgba(255,236,206,0) 40%),var(--stone);border:1px solid #4a3b2e;border-radius:2px;box-shadow:inset 0 1px 0 var(--edge-hi),0 10px 28px rgba(0,0,0,.45);padding:16px 20px}
.camphead::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#e3b456 18%,#e07a32 50%,#e3b456 82%,transparent);opacity:.75}
.camphead::after{content:"";position:absolute;right:-70px;bottom:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(227,180,86,.1),rgba(227,180,86,0) 68%);pointer-events:none}
.camphead .g.big{width:70px;height:70px;display:grid;place-items:center;font-size:2.5rem;border-radius:50%;background:radial-gradient(circle at 50% 35%,#3a2e22,#17110d 72%);border:2px solid #8a6a38;box-shadow:inset 0 0 14px rgba(0,0,0,.7),0 0 0 4px rgba(227,180,86,.1),0 0 26px rgba(224,122,50,.28);text-shadow:0 2px 6px rgba(0,0,0,.6)}
.chname .sh{font-size:1.6rem;letter-spacing:.02em;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.chlvl .bar{height:10px}
.camphead .stats{gap:6px}
.camphead .stats div{border:1px solid #3d332a;border-top:2px solid #6b4a2a;border-radius:2px;background:linear-gradient(rgba(255,236,206,.05),rgba(0,0,0,.18));padding:5px 9px 4px}
.camphead .stats dd{color:var(--gold-hi,#f0cf85);font-size:1.25rem}
.notice{border-left:4px solid var(--ember);border-radius:2px;background:linear-gradient(90deg,rgba(224,122,50,.12),rgba(224,122,50,0) 60%),var(--stone);box-shadow:0 4px 14px rgba(0,0,0,.35)}
/* tabs: an icon, a lit underline for the open one, no scrollbar */
.tabs{gap:2px;border-bottom:1px solid #4a3b2e;overflow-y:hidden;scrollbar-width:none;padding:0 2px;position:relative}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;border:1px solid transparent;border-radius:2px 2px 0 0;padding:10px 12px 9px;font-size:1.02rem;gap:7px;transition:color .18s,background .18s,transform .14s}
.tab::before{content:"";width:17px;height:17px;flex:none;background:currentColor;opacity:.65;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;transition:opacity .18s,transform .18s}
.tab:hover{color:var(--bone);background:linear-gradient(rgba(255,236,206,.06),rgba(255,236,206,0))}
.tab:hover::before{opacity:1;transform:translateY(-1px)}
.tab.on{color:#fff3dc;background:linear-gradient(180deg,rgba(224,122,50,.2),rgba(224,122,50,0) 70%),var(--stone);border-color:#5a4430;border-bottom-color:var(--stone)}
.tab.on::before{opacity:1;color:var(--ember)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--ember),transparent);box-shadow:0 0 12px var(--ember)}
.badge{box-shadow:0 0 10px rgba(224,122,50,.55);min-width:20px;text-align:center}
.tabbody{gap:12px}
/* section headings and panels */
.gpanel .sub,.tabbody>.sub,.xbody .sub{padding-bottom:6px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,#6b4a2a,rgba(107,74,42,0)) 1;margin-bottom:6px}
.gpanel{border-color:#43372c;background:linear-gradient(180deg,rgba(255,236,206,.045),rgba(255,236,206,0) 24%),var(--stone)}
.thead{background:linear-gradient(90deg,rgba(255,236,206,.04),rgba(255,236,206,0));border-left:3px solid #6b4a2a;padding:8px 12px}
.thead p{font-size:.88rem;color:#b8ab95}
/* item tiles: rarity glow from the top, an icon with weight, a lift on hover */
.itile{border-radius:2px;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--rc) 20%,transparent),transparent 70%),linear-gradient(#251e18,#15110e);transition:transform .14s,border-color .18s,box-shadow .2s;box-shadow:inset 0 1px 0 rgba(255,236,206,.06),0 2px 6px rgba(0,0,0,.35)}
.itile .sicon{filter:drop-shadow(0 2px 3px rgba(0,0,0,.7)) drop-shadow(0 0 6px color-mix(in srgb,var(--rc) 40%,transparent))}
.itile:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,236,206,.12),0 8px 18px rgba(0,0,0,.5),0 0 14px color-mix(in srgb,var(--rc) 28%,transparent)}
.itile.sel{animation:selPulse 1.8s ease-in-out infinite alternate}
@keyframes selPulse{from{box-shadow:inset 0 0 0 1px var(--rc),0 0 10px color-mix(in srgb,var(--rc) 30%,transparent)}to{box-shadow:inset 0 0 0 1px var(--rc),0 0 22px color-mix(in srgb,var(--rc) 55%,transparent)}}
.itile.r-legend{background:radial-gradient(100% 90% at 50% 0%,rgba(240,138,60,.3),transparent 72%),linear-gradient(#2a1d14,#150f0b)}
.itile.r-rare{background:radial-gradient(100% 90% at 50% 0%,rgba(236,211,106,.2),transparent 72%),linear-gradient(#272016,#15110e)}
.itile.empty{background:repeating-linear-gradient(135deg,rgba(255,255,255,.02) 0 6px,transparent 6px 12px);box-shadow:none}
.itile.empty:hover{transform:none;box-shadow:none}
.eslot>.lbl,.eslot>span:first-child{letter-spacing:.14em}
.eslots{gap:8px}
.chip{border-radius:2px;transition:border-color .18s,background .18s}
.chip:hover{border-color:#8a5a2c;background:#2e251d}
.chip.on{background:linear-gradient(rgba(224,122,50,.22),rgba(224,122,50,.06));box-shadow:0 0 10px rgba(224,122,50,.2)}

.fops{padding:10px;border:1px solid #3d332a;background:linear-gradient(rgba(224,122,50,.06),rgba(0,0,0,.2));border-radius:2px}
/* skills */
.scard{position:relative;border-radius:2px;border-color:#43372c;background:linear-gradient(180deg,rgba(255,236,206,.05),rgba(255,236,206,0) 34%),var(--stone);box-shadow:inset 0 1px 0 var(--edge-hi),0 3px 10px rgba(0,0,0,.35);transition:transform .14s,box-shadow .2s,border-color .18s;overflow:hidden}
.scard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#4a3b2e}
.scard.onbar::before{background:linear-gradient(var(--gold),var(--ember));box-shadow:0 0 12px var(--ember)}

.scard.onbar{background:linear-gradient(180deg,rgba(224,122,50,.16),rgba(224,122,50,0) 46%),var(--stone)}
.rslot{border-radius:2px;background:rgba(124,80,200,.05)}
.rchip{border-radius:2px}
.sgrid{gap:12px}
/* talents */
.tcard{border-radius:2px;background:linear-gradient(180deg,rgba(255,236,206,.045),rgba(255,236,206,0) 30%),var(--stone);transition:transform .14s,border-color .18s,box-shadow .2s}

.pips i{box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.pips i.on{box-shadow:0 0 8px var(--ember)}
/* expeditions: portals */
.portal{position:relative;overflow:hidden;border-radius:2px;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--pc) 22%,transparent),transparent 60%),linear-gradient(160deg,#2a221b,var(--stone));transition:transform .16s,box-shadow .2s,border-color .18s;box-shadow:inset 0 1px 0 var(--edge-hi),0 4px 12px rgba(0,0,0,.4)}
.portal::after{content:"";position:absolute;right:-16px;bottom:-16px;width:80px;height:80px;border-radius:50%;border:2px solid color-mix(in srgb,var(--pc) 35%,transparent);box-shadow:0 0 0 8px color-mix(in srgb,var(--pc) 10%,transparent),inset 0 0 18px color-mix(in srgb,var(--pc) 25%,transparent);opacity:.7;pointer-events:none;transition:transform .3s,opacity .2s}

.actnode .an-n{box-shadow:0 0 10px color-mix(in srgb,var(--bc) 40%,transparent)}
.an-link{background:linear-gradient(90deg,#4a3b2e,#6b4a2a)}
.actdetail{border-radius:2px;box-shadow:inset 0 1px 0 var(--edge-hi),0 6px 18px rgba(0,0,0,.4)}
.xcard{border-radius:2px;background:linear-gradient(180deg,rgba(255,236,206,.045),rgba(255,236,206,0) 28%),var(--stone);transition:transform .14s,box-shadow .2s;box-shadow:inset 0 1px 0 var(--edge-hi),0 3px 10px rgba(0,0,0,.35)}
.xcard:hover:not(.locked){transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,236,206,.1),0 10px 22px rgba(0,0,0,.5)}
.tormbar{--tc:#8a837a;border-radius:2px;border-left:4px solid var(--tc);border-color:color-mix(in srgb,var(--tc) 45%,#2a2420);border-left-color:var(--tc);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 16%,transparent),transparent 55%),var(--stone);transition:border-color .3s,background .3s}
.tormbar b:first-of-type{color:color-mix(in srgb,var(--tc) 55%,#efe6d4)}
.mtile{border-radius:2px;transition:transform .14s,border-color .18s,box-shadow .2s;box-shadow:inset 0 0 22px color-mix(in srgb,var(--bc) 25%,transparent),0 3px 10px rgba(0,0,0,.35)}
.mtile:hover{transform:translateY(-2px) scale(1.03);box-shadow:inset 0 0 26px color-mix(in srgb,var(--bc) 40%,transparent),0 8px 20px rgba(0,0,0,.5)}
.mtile.on{box-shadow:inset 0 0 26px color-mix(in srgb,var(--bc) 40%,transparent),0 0 20px rgba(227,180,86,.4)}
.mapdev>div:last-child{border-radius:2px}
/* atlas: compact gems instead of huge squares */
.atlasgrid{grid-template-columns:120px repeat(10,30px) auto;justify-content:start;gap:6px 6px;max-width:none;padding:10px 12px;background:linear-gradient(rgba(255,236,206,.03),rgba(0,0,0,.15));border:1px solid #3d332a;border-radius:2px}
.atlasgrid .ab{font-family:var(--f-display);font-size:.95rem;padding-right:8px}
.atlasgrid .ah{font-size:.68rem;letter-spacing:.06em}
.atlasgrid i{border-radius:3px;background:radial-gradient(circle at 35% 30%,#2e261f,#17120e);box-shadow:inset 0 1px 2px rgba(0,0,0,.6);transition:transform .14s}
.atlasgrid i:hover{transform:scale(1.12)}
.atlasgrid i.done{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--bc,#e07a32) 55%,#fff),var(--bc,#e07a32) 60%,color-mix(in srgb,var(--bc,#e07a32) 60%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 10px var(--bc,#e07a32)}
/* grimoire */
.gcard{border-radius:2px;background:linear-gradient(180deg,rgba(255,236,206,.045),rgba(255,236,206,0) 28%),var(--stone);transition:transform .14s,box-shadow .2s}
.gcard.known{box-shadow:inset 3px 0 0 #8a7ac8}
.gcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.45)}
/* scrollbars */
#scrCamp *{scrollbar-width:thin;scrollbar-color:#5a4430 transparent}
#scrCamp .tabs{scrollbar-width:none}
#scrCamp .tabs::-webkit-scrollbar{display:none}
.aprog{grid-template-columns:170px auto 44px;justify-content:start;gap:8px 12px;padding:8px 14px;border:1px solid #3d332a;border-radius:2px;background:linear-gradient(90deg,rgba(255,236,206,.035),rgba(255,236,206,0));margin-bottom:6px}
.aprog>span{font-family:var(--f-display);font-size:1rem;color:var(--bone)}
.aprog small{font-size:.8rem;color:var(--gold-hi,#f0cf85)}
.adots{grid-template-columns:repeat(10,26px);gap:6px}
.adots i{border-radius:4px;transform:rotate(45deg) scale(.78);background:radial-gradient(circle at 35% 30%,#2e261f,#17120e);box-shadow:inset 0 1px 2px rgba(0,0,0,.6);transition:transform .14s}
.adots i:hover{transform:rotate(45deg) scale(.95)}
.adots i.done{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--bc) 50%,#fff),var(--bc) 60%,color-mix(in srgb,var(--bc) 55%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 12px var(--bc)}
@media (max-width:640px){.aprog{grid-template-columns:1fr auto}.adots{grid-column:1/-1;grid-template-columns:repeat(10,minmax(0,1fr))}}
@media (max-width:900px){.camphead .g.big{width:56px;height:56px;font-size:2rem}.tab{padding:9px 13px 8px;font-size:1rem}}
@media (prefers-reduced-motion:reduce){.itile.sel{animation:none}.itile,.scard,.tcard,.portal,.xcard,.mtile,.gcard,.actnode,.tab{transition:none}}

/* ===== camp UX: paper doll, rune bench, campaign cards, supreme models, maps with a picture of the biome ===== */
.actcard.bio-crypt,.device.bio-crypt{--bc:#8a6a48} .actcard.bio-swamp,.device.bio-swamp{--bc:#5f8a55} .actcard.bio-forge,.device.bio-forge{--bc:#d0602a} .actcard.bio-cathedral,.device.bio-cathedral{--bc:#8fb0d8}
.device.bio-storm{--bc:#5b8fd8} .device.bio-tar{--bc:#c9a24a} .device.bio-fungal{--bc:#8a5fc0} .device.bio-ash{--bc:#c9a05a} .device.bio-sea{--bc:#4a9ab8}
/* the hero's equipment as a paper doll */
.doll{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:". elmo ." "arma armadura anel" ". botas .";gap:10px;padding:8px 2px;isolation:isolate}
.doll-bg{position:absolute;inset:0;z-index:-1;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.doll-bg::before{content:"";position:absolute;width:92%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(227,180,86,.25);background:repeating-conic-gradient(rgba(227,180,86,.14) 0 1.5deg,transparent 1.5deg 12deg),radial-gradient(circle,rgba(224,122,50,.14),rgba(224,122,50,0) 68%);box-shadow:inset 0 0 0 10px rgba(0,0,0,.15),inset 0 0 0 11px rgba(227,180,86,.12)}
.doll-bg .g{font-size:7.5rem;opacity:.09;filter:blur(.4px)}
.dslot{aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 5px 7px;min-width:0;width:100%}
.dslot .sicon{width:40px;height:40px}
.dslot .iname{font-size:.7rem;-webkit-line-clamp:2}
.dlbl{position:absolute;top:5px;left:0;right:0;text-align:center;font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ash);opacity:.85}
.dslot.empty .sicon{opacity:.35}
.ds-elmo{grid-area:elmo} .ds-arma{grid-area:arma} .ds-armadura{grid-area:armadura} .ds-anel{grid-area:anel} .ds-botas{grid-area:botas}
.cmpm{position:absolute;top:4px;right:6px;font-size:.72rem;font-weight:700;line-height:1}
.cmpm.up{color:#8fd18a;text-shadow:0 0 8px rgba(143,209,138,.8)} .cmpm.down{color:#ff8a7a}
.gearlayout:not(:has(.forge)){grid-template-columns:minmax(0,330px) minmax(0,1fr) minmax(0,290px)}
.gearlayout .detail{position:sticky;top:12px}
.runebag{align-items:stretch}
@media (max-width:1000px){.gearlayout .detail{position:static}}
/* runes */
.runebench{background:linear-gradient(90deg,rgba(138,106,216,.1),rgba(138,106,216,0) 50%),var(--stone);border:1px solid #43372c;border-left:3px solid #8a6ad8;border-radius:2px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.runebag{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.rune{--rc:#a98cf5;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid color-mix(in srgb,var(--rc) 35%,#2a2118);background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 14%,transparent),transparent 75%),#1a1511;border-radius:2px}
.rglyph{--rc:#a98cf5;width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-glyph);font-size:1.2rem;color:var(--rc);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--rc) 32%,#2a2118),#120d0a 75%);border:1px solid color-mix(in srgb,var(--rc) 60%,#000);box-shadow:0 0 12px color-mix(in srgb,var(--rc) 35%,transparent),inset 0 0 8px rgba(0,0,0,.6);text-shadow:0 0 8px var(--rc)}
.rtx{display:flex;flex-direction:column;min-width:0;text-align:left}
.rtx b{font-weight:600;font-size:.88rem;color:var(--rc)}
.rtx small{font-size:.74rem;color:var(--ash);line-height:1.25}
.rune em,.ropt em{font-style:normal;font-weight:700;color:var(--bone);font-variant-numeric:tabular-nums}
.rsock{--rc:#a98cf5;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 9px;border:1px solid color-mix(in srgb,var(--rc) 45%,#2a2118);border-radius:2px;background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 12%,transparent),transparent 80%),#16110e}
.rsock.empty{border-style:dashed;border-color:#5a4a80;cursor:pointer;list-style:none;color:var(--ash);font-size:.82rem;transition:border-color .18s,color .18s}
.rsock.empty::-webkit-details-marker{display:none}
.rsock.empty small{color:#a98cf5;font-size:.72rem}
.rsock.empty:hover{border-color:#a98cf5;color:var(--bone)}
.rglyph.plus{color:#a98cf5;font-size:1.3rem}
.rsock.none{opacity:.5;border-style:dashed;font-size:.8rem;color:var(--ash)}
.rsock .rx{background:none;border:1px solid #4a3b2e;color:var(--ash);width:24px;height:24px;cursor:pointer;font:inherit;font-size:.7rem;border-radius:2px}
.rsock .rx:hover{border-color:#e0584a;color:#ff8a7a}
.rsel[open] .rsock.empty{border-style:solid;border-color:#a98cf5}
.rlist{display:flex;flex-direction:column;gap:4px;margin-top:5px;max-height:230px;overflow-y:auto}
.ropt{--rc:#a98cf5;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:#1a1511;border:1px solid #3d332a;border-radius:2px;color:var(--bone);font:inherit;padding:6px 8px;cursor:pointer;transition:border-color .15s,background .15s,transform .12s}
.ropt:hover{border-color:var(--rc);background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 16%,transparent),transparent 80%),#1a1511;transform:translateX(2px)}
.ropt .rglyph{width:28px;height:28px;font-size:1rem}
/* piece models */
.model{font-family:var(--f-glyph);line-height:1;display:inline-block;background:linear-gradient(180deg,#4a4036,#1a1511 70%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.2px #e6dcc6;filter:drop-shadow(0 4px 6px rgba(0,0,0,.75)) drop-shadow(0 0 14px color-mix(in srgb,var(--bc,#e04a3a) 55%,transparent))}
.model.big{font-size:5.4rem}
.model.king{background:linear-gradient(180deg,#f6dc8a,#b8862e 70%);-webkit-text-stroke:1.2px #3a2608}
/* campaign: four act cards with a picture of the biome and the boss piece */
.actrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.actcard{--bc:var(--line);position:relative;overflow:hidden;min-height:138px;text-align:left;color:var(--bone);font:inherit;cursor:pointer;border:1px solid #43372c;border-bottom:3px solid var(--bc);border-radius:2px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(180deg,rgba(10,7,5,.1) 0%,rgba(10,7,5,.9) 80%),var(--img) center/cover,#1a1511;transition:transform .16s,box-shadow .2s,filter .2s}
.actcard:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.55),0 0 18px color-mix(in srgb,var(--bc) 30%,transparent)}
.actcard.on{border-color:var(--bc);box-shadow:inset 0 0 0 1px var(--bc),0 0 26px color-mix(in srgb,var(--bc) 38%,transparent)}
.actcard:disabled{filter:grayscale(.9) brightness(.5);cursor:not-allowed}
.actcard.cur::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--bc),var(--gold),var(--bc));background-size:200% 100%;animation:curSlide 2.4s linear infinite}
@keyframes curSlide{to{background-position:200% 0}}
.ac-n{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;border:2px solid var(--bc);display:grid;place-items:center;font-family:var(--f-display);font-size:.95rem;background:rgba(10,7,5,.75)}
.actcard.done .ac-n{background:var(--bc);color:#140d08}
.actcard .model{position:absolute;right:8px;top:2px;font-size:3.6rem;--bc:var(--bc)}
.ac-t{display:flex;flex-direction:column;position:relative;z-index:1}
.ac-t small{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ash)}
.ac-t b{font-family:var(--f-display);font-weight:400;font-size:1.15rem;line-height:1.15;text-shadow:0 2px 6px #000}
.ac-t em{font-style:normal;font-size:.76rem;color:var(--bc)}
.actcard.bio-swamp .ac-t em,.actcard.bio-swamp .ac-n{--bc:#7fb472}
.actdetail{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(220px,1fr);gap:0;align-items:stretch;padding:0;border:1px solid #4a3b2e;border-left:4px solid var(--bc);background:linear-gradient(90deg,rgba(14,10,8,.95) 0%,rgba(14,10,8,.85) 52%,rgba(14,10,8,.5) 100%),var(--img) center/cover,var(--stone)}
.ad-main{padding:18px 20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ad-main p{margin:0}
.ad-boss{padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--bc) 30%,transparent),transparent 72%);border-left:1px solid rgba(255,236,206,.08)}
.ad-boss b{font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.ad-boss small{color:var(--ash);font-size:.76rem;max-width:30ch}
.floors{display:flex;gap:6px;flex-wrap:wrap}
.floors span{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ash);padding:3px 10px;border:1px solid #3d332a;background:rgba(0,0,0,.4)}
.floors i{width:7px;height:7px;transform:rotate(45deg);background:var(--bc)}
.floors .boss{border-color:#6a2a22;color:#f0a090} .floors .boss i{background:#e04a3a}
/* supreme bosses: the model beside the card */
.ubers{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.xcard.uber,.xcard.pinnacle{flex-direction:row;gap:0;padding:0;overflow:hidden;align-items:stretch}
.xcard.uber{background:linear-gradient(90deg,rgba(14,10,8,.5),rgba(14,10,8,.95) 42%),var(--img) left center/cover,var(--stone)}
.xcard.pinnacle{background:linear-gradient(90deg,rgba(227,180,86,.14),rgba(14,10,8,.96) 40%),var(--stone)}
.ub-model{flex:0 0 118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 4px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--bc) 38%,transparent),transparent 72%)}
.ub-model .model{--bc:inherit}
.ub-shards{font-size:.7rem;color:var(--gold-hi,#f0cf85);letter-spacing:.06em;text-shadow:0 1px 3px #000}
.ub-body{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ub-body>button{margin-top:auto}
@media (max-width:520px){.xcard.uber,.xcard.pinnacle{flex-direction:column}.ub-model{flex-basis:auto}}
/* maps: a picture of the biome behind each map and behind the device */
.mtile{background:linear-gradient(180deg,rgba(10,7,5,.05) 25%,rgba(10,7,5,.86)),var(--img) center/cover,var(--stone);justify-content:flex-end;padding:8px 6px;border-color:#4a3b2e}
.mt-tier{position:absolute;top:5px;left:9px;font-size:1.6rem;text-shadow:0 2px 6px #000,0 0 12px color-mix(in srgb,var(--bc) 70%,transparent)}
.mt-name{color:var(--bone);text-shadow:0 1px 3px #000;font-size:.72rem}
.mt-aff{margin-top:2px}
.mt-new{background:var(--gold);color:#1a1008;padding:0 5px;border-radius:2px;font-weight:700;top:5px;right:5px}
.device{background:linear-gradient(180deg,rgba(18,13,10,.8),rgba(18,13,10,.97) 62%),var(--img) center top/cover,var(--stone);border-color:#6b4a2a;border-radius:2px;box-shadow:inset 0 1px 0 var(--edge-hi),0 10px 28px rgba(0,0,0,.45)}
.dev-core{background:radial-gradient(circle,rgba(0,0,0,.05) 30%,rgba(10,7,5,.62) 92%),var(--img) center/cover,#120d0a}
.dev-core .dc-tier{text-shadow:0 2px 10px #000,0 0 18px color-mix(in srgb,var(--bc) 70%,transparent)}
.dev-core .dc-name,.dev-core .xk{text-shadow:0 1px 4px #000}
.maff li{padding:2px 0 2px 16px}
.dev-cur{border-top-color:#4a3b2e}
.curbtn{border-radius:2px;transition:transform .14s,box-shadow .18s,border-color .18s}
.curbtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.45)}
@media (max-width:760px){.actrow{grid-template-columns:repeat(2,minmax(0,1fr))}.actdetail{grid-template-columns:minmax(0,1fr)}.ad-boss{border-left:0;border-top:1px solid rgba(255,236,206,.08)}.ubers{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.actcard.cur::before{animation:none}.actcard,.ropt,.curbtn{transition:none}}
/* forge bench */
.bench{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr) minmax(0,310px);gap:16px;align-items:start}
.bpick,.blist,.bframe{background:var(--stone);border:1px solid #43372c;border-radius:2px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bpick .igrid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
.bpick .chips{gap:4px}
.bcat{border:1px solid #3a2f26;background:#120e0b;border-radius:2px}
.bcat summary{cursor:pointer;list-style:none;text-align:center;padding:9px 10px;font-family:var(--f-display);font-size:1rem;letter-spacing:.06em;color:var(--gold);border-bottom:1px solid transparent}
.bcat summary::-webkit-details-marker{display:none}
.bcat summary::before{content:"- "}.bcat summary::after{content:" -"}
.bcat[open] summary{border-bottom-color:#3a2f26}
.brows{display:flex;flex-direction:column;gap:2px;padding:4px}
.bopt{display:grid;grid-template-columns:minmax(0,9.5rem) minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;background:#171310;border:1px solid transparent;border-left:3px solid #3a2f26;border-radius:2px;color:var(--bone);font:inherit;padding:8px 10px;cursor:pointer;transition:background .15s,border-color .15s}
.bopt:hover{background:#1d1814;border-left-color:#8a5a2c}
.bopt.on{background:#211a14;border-color:#7a5030;border-left-color:var(--ember)}
.bopt.poor{opacity:.55}
.bopt .bt{font-family:var(--f-display);color:var(--gold)}
.bopt .bd{font-size:.8rem;color:var(--ash);line-height:1.25}
.bopt .bc{font-size:.76rem;color:var(--bone);font-variant-numeric:tabular-nums;white-space:nowrap}
.bframe{border-color:#7a5030;box-shadow:inset 0 0 0 3px #15110e,inset 0 0 0 4px #43372c;padding:18px;position:sticky;top:12px}
.bslot{min-height:150px;background:#0f0c0a;border:1px solid #2e251e;border-radius:2px;padding:12px}
.bmeta{font-size:.66rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ash)}
.bname{font-family:var(--f-display);font-size:1.15rem;margin:2px 0 6px}
.baff{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:.84rem;color:var(--ash)}
.baff li{padding:2px 6px;border-left:2px solid transparent}
.baff li.rule{color:#f0a860}
.baff li.hl{border-left-color:var(--ember);background:rgba(224,122,50,.12);color:var(--bone)}
.bempty{margin:0;text-align:center;padding-top:44px}
.bsel{display:flex;flex-direction:column;gap:2px;font-size:.82rem;color:var(--ash);border:1px solid #3a2f26;padding:8px 10px;border-radius:2px;background:#120e0b}
.bsel b{font-family:var(--f-display);font-weight:400;color:var(--gold)}
.bsel em{font-style:normal;color:var(--bone);font-variant-numeric:tabular-nums}
.bsel em.poor{color:#ff8a7a}
.bsel.none{text-align:center}
.bmsg{font-size:.82rem;color:var(--bone);border-left:3px solid var(--ember);padding:4px 8px;background:rgba(224,122,50,.08)}
.craft{align-self:stretch;text-transform:uppercase;letter-spacing:.16em}
@media (max-width:1100px){.bench{grid-template-columns:minmax(0,230px) minmax(0,1fr)}.bframe{grid-column:1/-1;position:static}}
@media (max-width:700px){.bench{grid-template-columns:minmax(0,1fr)}.bopt{grid-template-columns:minmax(0,1fr) auto}.bopt .bd{grid-column:1/-1;order:3}}
@media (prefers-reduced-motion:reduce){.bopt{transition:none}}

/* runes: flat, one accent (no per-rune colours, no gradients) + king model fix */
.model.king{-webkit-background-clip:text;background-clip:text}
.sgrid.skills .scard{background:var(--stone);box-shadow:none}
.sgrid.skills .scard:hover:not(.locked){transform:none;box-shadow:none;border-color:#5a4635}
.sgrid.skills .scard.onbar{background:var(--stone);border-color:#7a5030;box-shadow:none}
.sgrid.skills .scard.onbar::before{background:var(--ember);box-shadow:none}
.rglyph.plus{color:var(--ash)}
.rsock{background:#171310;border:1px solid #43372c}
.rsock.empty{border-style:dashed;border-color:#4a3b2e;background:#171310}
.rsock.empty small{color:var(--ash)}
.rsock.empty:hover,.rsel[open] .rsock.empty{border-color:#8a5a2c;color:var(--bone)}

/* ===== nine equipment slots, item tooltips ===== */
.doll{grid-template-areas:". elmo amuleto" "arma armadura luvas" "anel cinto anel2" ". botas ."}
.dslot{aspect-ratio:1/.9;padding:16px 4px 6px}
.dslot .sicon{width:34px;height:34px}
.ds-luvas{grid-area:luvas} .ds-cinto{grid-area:cinto} .ds-amuleto{grid-area:amuleto} .ds-anel2{grid-area:anel2}
.ttip .tdh{margin-top:6px;padding-top:6px;border-top:1px solid #3d332a}
.ttip .diff{margin:2px 0 0;padding:0;list-style:none;font-size:.8rem}
.ttip .diff li.up{color:#8fd18a} .ttip .diff li.down{color:#ff8a7a}
.gearicons{flex-wrap:wrap}
.bpick .igrid{grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.bpick .itile{min-height:0;padding:6px 3px}
.bpick .itile .sicon{width:24px;height:24px}
.bpick .itile .iname{font-size:.62rem}

.xcard.pinnacle{background:linear-gradient(90deg,rgba(14,10,8,.5),rgba(14,10,8,.95) 150px) 0 0/360px 100% no-repeat,url(img/biome-cathedral.jpg) 0 0/360px 100% no-repeat,var(--stone)}

.savebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.savebar p{flex:1 1 100%;margin:4px 0 0}
/* mobile: the doll layout must not beat the small-screen rules */
@media (max-width:1000px){.gearlayout:not(:has(.forge)){grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.gearlayout:not(:has(.forge)) .detail{grid-column:1/-1}}
@media (max-width:640px){.gearlayout:not(:has(.forge)){grid-template-columns:minmax(0,1fr)}.doll{max-width:420px;margin:0 auto}}

/* ===== loot popup and item cards ===== */
.modal-box:has(.lootcmp),.modal-box:has(.lcard){max-width:760px}
.lootcmp{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.lcard{--rc:var(--r-common);display:flex;flex-direction:column;gap:8px;min-width:0;padding:12px;background:#181310;border:1px solid color-mix(in srgb,var(--rc) 40%,#3d332a);border-top:3px solid var(--rc);border-radius:2px}
.lcard.found{box-shadow:0 0 0 1px color-mix(in srgb,var(--rc) 35%,transparent),0 0 18px color-mix(in srgb,var(--rc) 16%,transparent)}
.lcard.empty{border-top-color:#4a3b2e;color:var(--ash)}
.lcard.compact{padding:8px 10px;gap:4px}
.lcard.compact .sicon{width:26px;height:26px}.lcard.compact .lname{font-size:.98rem}
.lhead{display:flex;align-items:center;gap:10px}
.lhead .sicon{width:40px;height:40px;flex:none;color:var(--rc);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--rc) 40%,transparent))}
.ltx{display:flex;flex-direction:column;min-width:0}
.lk{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.lname{font-family:var(--f-display);font-weight:400;font-size:1.15rem;line-height:1.15;color:var(--rc)}
.lmeta{font-size:.74rem;color:var(--ash)}
.llist{list-style:none;margin:0;padding:8px 0 0;border-top:1px solid #2c241d;display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--bone)}
.llist li.rule{color:#f0a860}
.ldiff{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid #2c241d;background:#14100d}
.lootcmp+.ldiff{margin-top:12px}.ldiff+.ldiff{margin-top:8px}
.ldiff .dh{margin:0;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);font-weight:400}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{padding:3px 9px;border:1px solid;border-radius:2px;font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.dchip.up{color:#8fd18a;border-color:#3f6a3c;background:rgba(143,209,138,.07)}
.dchip.down{color:#ff8a7a;border-color:#7a3a33;background:rgba(255,138,122,.07)}
.drule{padding:4px 9px;border-left:3px solid;font-size:.82rem;line-height:1.35}
.drule b{font-weight:600;margin-right:4px}
.drule.up{border-color:#3f6a3c;color:#c5e6c1}.drule.up b{color:#8fd18a}
.drule.down{border-color:#7a3a33;color:#f0c4bd}.drule.down b{color:#ff8a7a}
.modal-box #modalNote{font-size:.78rem;color:var(--ash)}
@media (max-width:520px){.lootcmp{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Rei Caído</h1>
    <span class="floor" id="floorLabel">O Abismo</span>
    <span class="turn" id="turnLabel"></span>
    <span class="herochip" id="heroChip"></span>
    <button class="ghost sm langbtn" id="btnLang" type="button" title="Idioma / Language">EN</button>
  </header>

  <section class="screen" id="scrHeroes" hidden></section>
  <section class="screen" id="scrCamp" hidden></section>

  <div class="game" id="scrGame" hidden>
    <div class="leftcol">
      <aside class="bossinfo" id="bossInfo" hidden aria-label="Informações do chefe" data-en-aria="Boss information"></aside>
      <section class="log">
        <h2 data-en="Chronicle">Crônica</h2>
        <ol id="log"></ol>
      </section>
    </div>
    <div class="board-col">
      <div class="bossbar" id="bossBar" hidden>
        <div class="bb-name" id="bbName"></div>
        <div class="bb-bar"><i id="bbFill"></i><span class="bb-mark"></span></div>
        <div class="bb-sub" id="bbSub"></div>
      </div>
      <div class="tidebar hordebar" id="hordeBar" hidden><span data-en="Horde">Horda</span><div class="tb-bar"><i id="hbFill"></i></div><small id="hbSub"></small></div>
      <div class="tidebar" id="tideBar" hidden><span data-en="Tide's Wrath">Ira da Maré</span><div class="tb-bar"><i id="tbFill"></i></div><small id="tbSub"></small></div>
      <div class="tutbar" id="tutBar" hidden><span class="tt-step" id="ttStep"></span><b id="ttGoal"></b><span class="tt-dots" id="ttDots"></span></div>
      <div class="board-frame">
        <canvas id="cv" aria-label="Tabuleiro do andar" data-en-aria="Floor board"></canvas>
        <div class="tip" id="tip" hidden></div>
        <div class="banner" id="banner" hidden><b id="bnTitle"></b><span id="bnSub"></span></div>
        <div class="overlay" id="overlay" hidden></div>
      </div>
      <div class="hotbar" id="hotbar">
        <button class="hk" id="btnS0" type="button"><span class="key">1</span><b id="sName0"></b><small id="sDesc0"></small><span class="cd" id="sCd0"></span></button>
        <button class="hk" id="btnS1" type="button"><span class="key">2</span><b id="sName1"></b><small id="sDesc1"></small><span class="cd" id="sCd1"></span></button>
        <button class="hk" id="btnS2" type="button" hidden><span class="key">3</span><b id="sName2"></b><small id="sDesc2"></small><span class="cd" id="sCd2"></span></button>
        <button class="hk" id="btnS3" type="button" hidden><span class="key">4</span><b id="sName3"></b><small id="sDesc3"></small><span class="cd" id="sCd3"></span></button>
        <button class="hk" id="btnPact" type="button"><span class="key" id="pactKey">3</span><b data-en="Blood Pact">Pacto de Sangue</b><small id="pactDesc"></small></button>
        <button class="hk" id="btnWait" type="button"><span class="key" id="waitKey">E</span><b data-en="Wait">Esperar</b><small data-en="Ends the turn without acting">Encerra o turno sem agir</small></button>
      </div>
      <div class="chessbar" id="chessBar" hidden><div class="cbtxt"><b id="cbTitle"></b><small id="cbSub"></small></div>
        <button class="ghost sm" id="cbHint" type="button" data-en="Hint">Dica</button><button class="ghost sm" id="cbQuit" type="button" data-en="Give up (thaws)">Desistir (descongela)</button></div>
      <p class="hint" id="hint"></p>
    </div>

    <aside class="panel">
      <section>
        <h2><span id="clsName">Cavaleiro</span> <span class="side" id="stSide"></span></h2>
        <div class="vital"><div class="vl"><span data-en="Health">Vida</span><span id="hpTxt"></span></div><div class="bar"><i id="hpBar"></i></div></div>
        <div class="vital"><div class="vl"><span data-en="Shield">Escudo</span><span id="shTxt"></span></div><div class="bar shield"><i id="shBar"></i></div></div>
        <div class="vital"><div class="vl"><span data-en="Experience">Experiência</span><span id="xpTxt"></span></div><div class="bar xp"><i id="xpBar"></i></div></div>
        <dl class="stats">
          <div><dt data-en="Damage">Dano</dt><dd id="stDmg"></dd></div>
          <div><dt data-en="Actions">Ações</dt><dd id="stAct"></dd></div>
          <div><dt data-en="Gold">Ouro</dt><dd id="stGold"></dd></div>
        </dl>
        <ul class="passives" id="passives"></ul>
      </section>
      <section class="gear">
        <h2 data-en="Gear">Equipamento</h2>
        <div id="gear"></div>
      </section>
      <button class="ghost sm quit" id="btnQuit" type="button" data-en="Abandon expedition">Desistir da expedição</button>
      <button class="ghost sm" id="btnSound" type="button">Som: ligado (M)</button>
    </aside>
  </div>
</div>

<button class="primary mrestore" id="modalRestore" type="button" hidden data-en="Back to the choice">Voltar à escolha</button>
<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="ghost sm" id="modalMin" type="button" hidden data-en="Minimize">Minimizar</button></div>
    <div id="modalBody"></div>
    <p class="note" id="modalNote"></p>
    <div class="row" id="modalActions"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/tree.js"></script>
<script src="js/items.js"></script>
<script src="js/world.js"></script>
<script src="js/combat.js"></script>
<script src="js/chess.js"></script>
<script src="js/events.js"></script>
<script src="js/ascend.js"></script>
<script src="js/ascend2.js"></script>
<script src="js/skilltree.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/render.js"></script>
<script src="js/fxengine.js"></script>
<script src="js/vfx.js"></script>
<script src="js/ui.js"></script>
<script src="js/treeui.js"></script>
</body>
</html>
